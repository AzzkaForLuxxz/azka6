name: Build Azka6 EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-azka6:
    runs-on: windows-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Compile C++ menjadi EXE
        run: g++ -static "azka6.cpp" -o "azka6.exe"

      - name: Upload file EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-azka6
          path: "azka6.exe"
